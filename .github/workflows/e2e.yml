name: E2E Smoke
# Boots the real workers + local D1 via wrangler dev and drives the volunteer
# journeys (Chromium + WebKit projects) plus the foodbox-admin console smoke
# (admin-chromium project on :8788). Runs on every PR and on main pushes —
# pushes to main auto-deploy, so these journeys must gate production, not
# just be available on demand.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
