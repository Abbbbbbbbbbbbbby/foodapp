name: E2E Smoke
# Boots the real workers + local D1 via wrangler dev and drives the volunteer
# journeys (Chromium + WebKit projects) plus the foodbox-admin console smoke
# (admin-chromium project on :8788). Runs on every PR and on main pushes —
# pushes to main auto-deploy, so these journeys must gate production, not
# just be available on demand.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # The runner image pre-registers a google-chrome-stable apt source we
      # never use (Playwright installs its own bundled Chromium/WebKit, not
      # system Chrome) — but --with-deps still runs `apt-get update` across
      # every configured source, and that mirror has been serving a
      # consistently stale/mismatched index ("Hash Sum mismatch"), failing
      # the whole install. Drop the source first so apt never touches it.
      - name: Install Playwright browsers
        run: |
          # Find by content, not a guessed filename — Ubuntu 24.04 runners
          # can use either the legacy one-line format or DEB822 .sources
          # files, and the previous attempt's guessed path didn't match.
          sudo grep -rl 'dl.google.com/linux/chrome' /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null \
            | xargs -r sudo rm -f
          npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
