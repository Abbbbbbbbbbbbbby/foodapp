name: E2E Smoke
# Boots the real workers + local D1 via wrangler dev and drives the volunteer
# journeys (Chromium + WebKit projects) plus the foodbox-admin console smoke
# (admin-chromium project on :8788). Runs on every PR and on main pushes —
# pushes to main auto-deploy, so these journeys must gate production, not
# just be available on demand.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # Retried: the underlying apt-get (from --with-deps) hits Google's
      # Chrome package mirror, which intermittently serves a stale/mismatched
      # index ("Hash Sum mismatch") — a transient upstream issue, not
      # anything in this repo. Usually clears within one or two retries.
      - name: Install Playwright browsers
        run: |
          for i in 1 2 3; do
            npx playwright install --with-deps chromium webkit && exit 0
            echo "Install attempt $i failed, retrying in 15s..."
            sleep 15
          done
          exit 1
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
