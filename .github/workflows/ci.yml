name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Build PWA (required by worker tests)
        run: npm run build

      - name: Worker typecheck
        run: npx tsc --noEmit

      - name: PWA typecheck
        run: npx tsc --noEmit -p src/pwa/tsconfig.json

      - name: Admin typecheck
        run: npx tsc --noEmit -p src/admin/tsconfig.json

      - name: Worker tests
        run: npx vitest run

      - name: Admin worker tests
        run: npm run test:admin

      - name: PWA unit tests (with enforced coverage floor)
        run: npm run test:pwa:coverage

      - name: PWA component tests
        run: npm run test:ui

      - name: Scripts tests
        run: npm run test:scripts
