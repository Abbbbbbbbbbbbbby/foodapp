<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#121212" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Food Line Check-In</title>
    <script>
      // Early errors (before React/telemetry.ts have loaded) are queued for
      // telemetry.ts's initTelemetry() to drain, and shown as a banner — the
      // page and #root are NEVER wiped, so an in-progress entry (React state
      // + the debounced IndexedDB draft write) survives. telemetry.ts
      // installs its own window.onerror once loaded, chaining this one; it
      // suppresses this banner for errors already handled by the React
      // ErrorBoundary (no duplicate banner).
      window.onerror = function(msg, src, line, col, err) {
        window.__earlyErrors = window.__earlyErrors || [];
        window.__earlyErrors.push({ msg: String(msg), stack: err && err.stack ? err.stack : undefined });
        if (document.getElementById('early-error-banner')) return;
        var b = document.createElement('div');
        b.id = 'early-error-banner';
        b.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:2000;max-height:60%;overflow:auto;background:#3a1414;color:#f4f4f4;padding:8px 12px;font:13px -apple-system,sans-serif;text-align:left';
        var headline = document.createElement('div');
        headline.style.cssText = 'text-align:center;margin-bottom:6px';
        headline.textContent = 'Something went wrong — reload if the app is stuck. / Algo salió mal — recargue si la aplicación no responde.';
        b.appendChild(headline);
        // Diagnostic detail for a crash this early: telemetry.ts hasn't loaded
        // yet (or never will, if THIS is what's failing to load), so nothing
        // reaches the server — this is the only place the real error is ever
        // visible. Shown on-device rather than only logged, since a device
        // old enough to hit this may not support remote debugging at all.
        var detail = document.createElement('pre');
        detail.style.cssText = 'white-space:pre-wrap;word-break:break-all;font:11px monospace;margin:0;opacity:0.85';
        detail.textContent = String(msg) + ' (' + (src || '?') + ':' + line + ':' + col + ')' + (err && err.stack ? '\n' + err.stack : '');
        b.appendChild(detail);
        document.body.appendChild(b);
      };
    </script>
  </head>
  <body>
    <div id="root"><div style="color:#f4f4f4;padding:32px;font-family:-apple-system,sans-serif;font-size:18px">Loading…</div></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
